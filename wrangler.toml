name = "planetary-max"
main = "src/index.ts"
compatibility_date = "2026-09-17"

[vars]
PLANETARY_MODE = "active"
UMBRELLA_ENFORCEMENT = "enabled"
MAX_OS_VERSION = "1"
PORTAL_OS_PHASE = "12"
KERNEL_TIMEOUT_MS = "5000"
SUBSTRATE_TIMEOUT_MS = "3000"
MAX_RETRY_ATTEMPTS = "3"
RETRY_BASE_DELAY_MS = "50"
CIRCUIT_FAILURE_THRESHOLD = "5"
CIRCUIT_COOLDOWN_MS = "30000"
PORTAL_OS_KERNEL_URL = "https://portal-os-kernel.maxchaz1.workers.dev"
JWT_SECRET = "your-jwt-secret-key-phase-12"
JWT_ISSUER = "max-os-1"
JWT_AUDIENCE = "portal-os"

[[services]]
binding = "KERNEL_SERVICE"
service = "portal-kernel"

[[r2_buckets]]
binding = "MAXOS_STATE"
bucket_name = "planetary-max-state"

[build]
command = "npm run build"
